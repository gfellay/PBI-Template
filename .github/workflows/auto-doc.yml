name: Auto-Documentation Power BI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Proyecto Power BI
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Descargar Motor Documentador
        shell: python
        run: |
          import urllib.request
          # Esta es la URL de tu repositorio gfellay/pbi-tmdl-documenter
          url = "https://githubusercontent.com"
          urllib.request.urlretrieve(url, "documenter.py")
          print("✅ Script descargado correctamente")

      - name: Ejecutar Documentador
        run: python documenter.py .

      - name: Guardar Excel como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Documentacion-Tecnica
          path: Documentacion_PBI_Final.xlsx
          retention-days: 30
