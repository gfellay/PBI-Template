name: Auto-Documentation Power BI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Proyecto Power BI
        uses: actions/checkout@v4
        with:
          path: main-project # Ponemos el reporte en esta carpeta

      - name: Checkout del Motor Documentador
        uses: actions/checkout@v4
        with:
          repository: gfellay/pbi-tmdl-documenter
          path: tools # Ponemos tu script en esta carpeta

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Ejecutar Documentador
        run: |
          # Ejecutamos el script que está en 'tools' sobre la carpeta 'main-project'
          python tools/documenter.py main-project

      - name: Guardar Excel como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Documentacion-Tecnica
          path: Documentacion_PBI_Final.xlsx
          retention-days: 30
