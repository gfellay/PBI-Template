name: Power BI Best Practices Scan

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tabular Editor CLI
        run: dotnet tool install -g TabularEditor.2.CLI

      - name: Run Best Practice Analyzer
        shell: pwsh
        run: |
          # 1. Buscamos la carpeta del modelo automáticamente
          $modelPath = Get-ChildItem -Directory -Filter "*.SemanticModel" | Select-Object -First 1 -ExpandProperty FullName
          
          if (-not $modelPath) { 
              Write-Error "No se encontró ninguna carpeta .SemanticModel"; exit 1 
          }

          Write-Host "Analizando modelo en: $modelPath"

          # 2. Ejecutamos el análisis (te2 es el comando del Tabular Editor instalado arriba)
          # Usamos las reglas oficiales de Microsoft
          # El flag -V hace que falle si hay violaciones de reglas
          & "C:\Users\runneradmin\.dotnet\tools\te2.exe" $modelPath -B "https://githubusercontent.com" -V