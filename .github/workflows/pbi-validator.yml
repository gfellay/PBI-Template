name: Power BI TMDL & Project Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest # Cambiamos a Windows porque las herramientas de PBI corren mejor ahí
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalamos PBI-Inspector CLI directamente (ahora se llama FabInspector)
      - name: Install FabInspector
        run: |
          dotnet tool install -g FabInspector.CLI

      # Ejecutamos la validación en tu carpeta de proyecto
      - name: Run Validation
        run: |
          fab-inspector scan --path "./" --recursive
