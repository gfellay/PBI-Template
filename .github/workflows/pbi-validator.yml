name: Power BI Best Practices Scan

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Descarga Tabular Editor 2 (Portable)
      - name: Setup Tabular Editor
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "TE.zip"
          Expand-Archive -Path "TE.zip" -DestinationPath "TE"

      # Ejecuta el escáner sobre tu modelo TMDL
      - name: Run Best Practice Analyzer
        run: |
          ./TE/TabularEditor.exe "./TuProyecto.SemanticModel" -B "https://githubusercontent.com" -V
