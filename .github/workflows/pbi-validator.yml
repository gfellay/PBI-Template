name: Power BI Project Scan
on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Power BI Project
        shell: pwsh
        run: |
          # 1. Buscamos el archivo de proyecto (.pbip)
          $projectFile = (Get-ChildItem -Filter "*.pbip" -Recurse | Select-Object -First 1).FullName
          
          if (-not $projectFile) { 
              Write-Error "No se encontró ningún archivo .pbip"; exit 1 
          }

          Write-Host "Validando proyecto: $projectFile"

          # 2. Usamos el comando nativo de compilación/validación de Power BI
          # Esto verifica que el TMDL y los metadatos sean correctos
          dotnet build "$projectFile"
