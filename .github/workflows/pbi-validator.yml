name: Power BI Best Practices Scan

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Usamos la acción oficial que ya sabe cómo bajar Tabular Editor
      - name: Setup Tabular Editor 2
        uses: dotnet/sidebar-action@v1 # Esta acción ayuda con herramientas .NET
        with:
          dotnet-version: '6.0.x'

      - name: Install Tabular Editor CLI
        run: dotnet tool install -g TabularEditor.2.CLI

      - name: Run Best Practice Analyzer
        shell: pwsh
        run: |
          # Buscamos automáticamente la carpeta .SemanticModel para que no falle
          $modelPath = Get-ChildItem -Directory -Filter "*.SemanticModel" | Select-Object -First 1 -ExpandProperty FullName
          
          Write-Host "Analizando modelo en: $modelPath"
          
          # Ejecutamos el análisis con las reglas oficiales de Microsoft
          te2 $modelPath -B "https://githubusercontent.com" -V
