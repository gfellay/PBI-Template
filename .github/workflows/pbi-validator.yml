name: Power BI Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Este paso usa una herramienta que analiza archivos .pbip / TMDL
      - name: Run PBI Inspector
        uses: m-phelps/pbi-inspector-action@v1
        with:
          report-path: './' # Busca en la raíz del proyecto
