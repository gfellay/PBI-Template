name: Power BI Scan
on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Scan
        shell: pwsh
        run: |
          # Descarga directa sin variables para evitar recortes
          Invoke-WebRequest 'https://github.com' -OutFile 'TE.zip'
          
          Expand-Archive TE.zip -DestinationPath TE_Folder
          
          $model = (Get-ChildItem -Directory -Filter "*.SemanticModel")[0].FullName
          
          Write-Host "Analizando: $model"
          
          # Ejecución directa
          ./TE_Folder/TabularEditor.exe "$model" -B "https://githubusercontent.com" -V
