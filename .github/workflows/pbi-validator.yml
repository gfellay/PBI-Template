name: Power BI Scan
on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download and Run Tabular Editor (via Python)
        shell: bash
        run: |
          # 1. Usamos Python para descargar y descomprimir (más robusto)
          python -c "import urllib.request, zipfile, os; urllib.request.urlretrieve('https://github.com', 'TE.zip'); zipfile.ZipFile('TE.zip').extractall('TE_Folder')"
          
          # 2. Buscamos la carpeta .SemanticModel
          MODEL_PATH=$(find . -maxdepth 2 -name "*.SemanticModel" -type d | head -n 1)
          echo "Analizando modelo en: $MODEL_PATH"
          
          # 3. Ejecutamos el escáner
          ./TE_Folder/TabularEditor.exe "$MODEL_PATH" -B "https://githubusercontent.com" -V
