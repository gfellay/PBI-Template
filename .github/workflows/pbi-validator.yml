name: Power BI Best Practices Scan

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tabular Editor 2
        shell: pwsh
        run: |
          $url = "https://github.com"
          $dest = "TE.zip"
          try {
              Write-Host "Descargando Tabular Editor desde $url..."
              Invoke-WebRequest -Uri $url -OutFile $dest -ErrorAction Stop
              Expand-Archive -Path $dest -DestinationPath "TE" -Force
              Write-Host "Instalación completada con éxito."
          } catch {
              Write-Error "Error en la descarga: $($_.Exception.Message)"
              exit 1
          }

      - name: Run Best Practice Analyzer
        shell: pwsh
        run: |
          # REEMPLAZA 'TuCarpeta.SemanticModel' con el nombre real de tu carpeta de Power BI
          ./TE/TabularEditor.exe "./TuCarpeta.SemanticModel" -B "https://githubusercontent.com" -V
